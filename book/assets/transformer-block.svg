  <g font-family="Segoe UI,Arial,sans-serif" fill="#213b35" text-anchor="middle">
    <text x="380" y="30" font-size="19" font-weight="600">One explicit Pre-Norm decoder block</text>
    <g fill="#eaf1e9" stroke="#226b59"><rect x="45" y="62" width="115" height="46" rx="4"/><rect x="212" y="62" width="110" height="46" rx="4"/><rect x="375" y="51" width="176" height="68" rx="4"/><rect x="610" y="62" width="105" height="46" rx="4"/><rect x="212" y="232" width="110" height="46" rx="4"/><rect x="375" y="221" width="176" height="68" rx="4"/><rect x="610" y="232" width="105" height="46" rx="4"/></g>
    <g font-size="16"><text x="102" y="91">Input X</text><text x="267" y="91">LN1</text><text x="463" y="77">Causal attention</text><text x="463" y="102">heads + WO</text><text x="663" y="91">Add → R</text><text x="267" y="261">LN2</text><text x="463" y="248">Token-wise FFN</text><text x="463" y="273">expand / activate</text><text x="663" y="261">Add → Y</text></g>
