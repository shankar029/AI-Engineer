  <g font-family="Segoe UI,Arial,sans-serif" fill="#213b35" text-anchor="middle">
    <text x="380" y="30" font-size="19" font-weight="600">Toy top-two router: select, renormalize, combine</text>
    <g fill="#eaf1e9" stroke="#226b59"><rect x="18" y="102" width="113" height="67" rx="4"/><rect x="169" y="102" width="156" height="67" rx="4"/><rect x="372" y="54" width="146" height="58" rx="4"/><rect x="372" y="145" width="146" height="58" rx="4"/><rect x="585" y="102" width="157" height="67" rx="4"/></g>
    <g font-size="16"><text x="74" y="129">Token row</text><text x="74" y="153">[1,2]</text><text x="247" y="129">Router logits</text><text x="247" y="153">[ln 3, ln 2, 0]</text><text x="445" y="78">Expert 1 → [1,3]</text><text x="445" y="102">weight 3/5</text><text x="445" y="169">Expert 2 → [4,0]</text><text x="445" y="193">weight 2/5</text><text x="663" y="129">Weighted sum</text><text x="663" y="153">[2.2,1.8]</text></g>
