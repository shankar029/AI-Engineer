<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
<title>Rectangles approach the area under a changing rate</title>
<rect width="760" height="360" fill="#f1f3ea"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#213b35"><text x="30" y="32" font-size="14" letter-spacing="2">ACCUMULATE RATE TIMES DURATION</text><text x="30" y="64" font-size="16">Rate (tokens / second)</text></g>
<g fill="#f7e9dd" stroke="#ab4a2d" stroke-width="2"><rect x="80" y="220" width="70" height="60"/><rect x="150" y="160" width="70" height="120"/><rect x="220" y="100" width="70" height="180"/></g>
<path d="M80 280L290 100V280Z" fill="#226b59" fill-opacity="0.14"/>
<path d="M80 280L290 100" fill="none" stroke="#226b59" stroke-width="3"/>
<g stroke="#7b8a73" fill="none"><path d="M60 280H335M80 300V82"/></g>
<g font-family="monospace" font-size="14" fill="#606963"><text x="63" y="301">0</text><text x="146" y="301">1</text><text x="216" y="301">2</text><text x="286" y="301">3</text><text x="60" y="225">2</text><text x="60" y="165">4</text><text x="60" y="105">6</text></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#213b35"><text x="178" y="338" font-size="16">Time (seconds)</text><text x="125" y="168" font-size="17" fill="#226b59">r(t) = 2t</text><text x="390" y="115" font-size="14" letter-spacing="1">THREE RIGHT-ENDPOINT RECTANGLES</text><text x="390" y="154" font-size="22" fill="#ab4a2d">(2 + 4 + 6) x 1 = 12 tokens</text><text x="390" y="212" font-size="14" letter-spacing="1">EXACT TRIANGLE AREA</text><text x="390" y="251" font-size="22" fill="#226b59">(1/2) x 3 x 6 = 9 tokens</text><text x="390" y="309" font-size="16" fill="#606963">Smaller pieces make the estimate closer.</text></g>
</svg>
