    <g font-size="16"><text x="145" y="195">key 1       key 2</text><text x="397" y="195">key 1       key 2</text><text x="645" y="195">value mixture</text><text x="145" y="229">0          blocked</text><text x="145" y="263">0           ln 3</text><text x="397" y="229">1              0</text><text x="397" y="263">1/4          3/4</text><text x="645" y="229">2</text><text x="645" y="263">0.5 + 3 = 3.5</text></g>
