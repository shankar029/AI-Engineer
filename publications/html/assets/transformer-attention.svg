    <g font-size="16"><text x="125" y="78">Q: [1, 1] column</text><text x="125" y="100">queries</text><text x="380" y="78">K: [0, ln 3] column</text><text x="380" y="100">keys</text><text x="635" y="78">V: [2, 4] column</text><text x="635" y="100">values</text></g>
    <g font-size="15"><text x="145" y="151" font-weight="600">Scaled scores + mask</text><text x="397" y="151" font-weight="600">Row weights</text><text x="648" y="151" font-weight="600">Output</text></g>
