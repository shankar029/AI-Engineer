  <g font-family="Segoe UI,Arial,sans-serif" fill="#213b35" text-anchor="middle">
    <text x="380" y="30" font-size="19" font-weight="600">One complete path from IDs to an ID</text>
    <g fill="#eaf1e9" stroke="#226b59"><rect x="18" y="58" width="147" height="64" rx="4"/><rect x="207" y="58" width="147" height="64" rx="4"/><rect x="396" y="58" width="147" height="64" rx="4"/><rect x="585" y="58" width="157" height="64" rx="4"/><rect x="585" y="168" width="157" height="64" rx="4"/><rect x="396" y="168" width="147" height="64" rx="4"/><rect x="207" y="168" width="147" height="64" rx="4"/><rect x="18" y="168" width="147" height="64" rx="4"/><rect x="18" y="276" width="220" height="47" rx="4"/><rect x="310" y="276" width="188" height="47" rx="4"/><rect x="570" y="276" width="172" height="47" rx="4"/></g>
    <g font-size="15"><text x="91" y="82">Tokenize</text><text x="91" y="107">IDs [0,1]</text><text x="280" y="82">Lookup + position</text><text x="280" y="107">[1,0]; [0,1]</text><text x="469" y="82">LN1</text><text x="469" y="107">same chosen rows</text><text x="663" y="82">Two-head attention</text><text x="663" y="107">[3,1]; [7.5,−0.5]</text><text x="663" y="192">Add X</text><text x="663" y="217">[4,1]; [7.5,0.5]</text><text x="469" y="192">LN2 + FFN</text><text x="469" y="217">near [2,1] each</text><text x="280" y="192">Add R</text><text x="280" y="217">near [6,2]; [9.5,1.5]</text><text x="91" y="192">Final norm</text><text x="91" y="217">last row near [1,−1]</text><text x="128" y="295">Vocabulary projection</text><text x="128" y="316">near [ln 2, 0, −ln 2]</text><text x="404" y="295">Softmax</text><text x="404" y="316">near [4/7,2/7,1/7]</text><text x="656" y="295">Greedy selection</text><text x="656" y="316">ID 0 → append</text></g>
